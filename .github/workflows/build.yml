name: build

# Publishes the multi-seat image to GHCR so a Vast template can point at it.
# Vast pulls a Docker image, not a git repo, so this workflow — not the push
# itself — is what makes a commit launchable.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_image:
        description: "Base image to build from"
        required: false
        default: "vastai/comfy:v0.30.0-cuda-13.2-py312"

# Serialise runs so two pushes can't race to publish :latest with no guarantee
# about which finishes last. Queue rather than cancel: cancelling killed a run
# that had already pushed all three tags and was merely exporting its build
# cache, which then reported a successful publish as a failed build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DEFAULT_BASE: "vastai/comfy:v0.30.0-cuda-13.2-py312"

jobs:
  # Does this commit change anything the IMAGE contains? Docs and tests don't,
  # so rebuilding for them wastes ~20 minutes of runner time and — worse —
  # a later docs push cancels an in-flight image build via the concurrency
  # rule above, which is how a successful publish ended up reported as a
  # failed run.
  changes:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          set -euo pipefail
          # Anything other than a plain push (tag, manual, PR) always builds.
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "image=true" >> "$GITHUB_OUTPUT"; echo "reason: event is ${{ github.event_name }}"; exit 0
          fi
          before="${{ github.event.before }}"
          # All-zeros means a new branch with no comparable parent.
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "image=true" >> "$GITHUB_OUTPUT"; echo "reason: no usable base commit"; exit 0
          fi
          changed="$(git diff --name-only "$before" "${{ github.sha }}")"
          echo "changed files:"; echo "$changed" | sed 's/^/  /'
          # Paths that actually end up in, or define, the image.
          if echo "$changed" | grep -qE '^(Dockerfile|scripts/|supervisor/|\.dockerignore|\.github/workflows/)'; then
            echo "image=true" >> "$GITHUB_OUTPUT"; echo "-> image inputs changed, building"
          else
            echo "image=false" >> "$GITHUB_OUTPUT"; echo "-> docs/tests only, skipping the image build"
          fi

  # Fast feedback: the topology and argument checks need no Docker and no
  # private source, so they gate the expensive build. Always runs — the docs
  # carry port lists that these tests validate.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Static analysis first: it catches whole classes of shell bug (unquoted
      # expansions, string/array confusion) that the behavioural tests can only
      # catch one instance of.
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --version
          # Globbed, not listed: a hardcoded list silently skips new scripts.
          shellcheck -x -S warning \
            scripts/*.sh scripts/lib/*.sh scripts/bin/* \
            build.sh tests/*.sh

      - name: Run checks
        run: bash tests/run-all.sh

      - name: Verify seat scripts are executable in git
        # The image chmods at build time, but a non-exec bit here usually means
        # someone edited over a Windows mount and lost it silently.
        run: |
          for f in scripts/*.sh scripts/bin/*; do
            mode=$(git ls-files -s "$f" | cut -d' ' -f1)
            echo "$mode  $f"
            [ "$mode" = "100755" ] || { echo "::error file=$f::not executable in git (expected 100755, got $mode)"; exit 1; }
          done

  build:
    needs: [changes, test]
    runs-on: ubuntu-latest
    # Don't publish from forks/PRs — they can't have registry write anyway —
    # and don't rebuild an identical image for a docs-only commit.
    if: github.event_name != 'pull_request' && needs.changes.outputs.image == 'true'
    permissions:
      contents: read
      packages: write
    # Two CUDA variants. Vast hosts differ in driver version, and a host whose
    # "Max CUDA" is below the image's CUDA can't run it — so publish a 12.9
    # build alongside the default 13.2 and let the operator match the machine.
    strategy:
      fail-fast: false
      matrix:
        include:
          - base: vastai/comfy:v0.30.0-cuda-13.2-py312
            suffix: ''
          - base: vastai/comfy:v0.30.0-cuda-12.9-py312
            suffix: '-cuda12.9'
    steps:
      - uses: actions/checkout@v4

      # The base image is ~7.5 GB compressed and much larger unpacked, which
      # overruns a stock runner. Reclaiming the preinstalled toolchains buys
      # roughly 25 GB and is the difference between a build and a disk error.
      - name: Free disk space
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          echo "after:"; df -h / | tail -1

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # onlatest so the variant suffix reaches :latest too, giving
          # :latest and :latest-cuda12.9 rather than one clobbering the other.
          flavor: |
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Vast hosts are linux/amd64; never inherit the runner's arch.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ github.event.inputs.base_image || matrix.base }}
          # No GitHub Actions cache. Build time here is dominated by pulling a
          # ~7.5 GB base that no GHA cache can help with, while `mode=max`
          # exported thousands of layers into a 10 GB repo-wide cache — slow
          # enough that it was still running after the image had published, and
          # far too large to survive two matrix legs. Our own layers (apt +
          # COPY) rebuild in about a minute.

      - name: Summary
        run: |
          {
            echo "### Published (base: \`${{ matrix.base }}\`)"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Point the Vast template at one of the tags above. Pick the CUDA"
            echo "variant that the host machine can actually run — compare the"
            echo "machine's **Max CUDA** on the Vast offer against the image's CUDA."
          } >> "$GITHUB_STEP_SUMMARY"
