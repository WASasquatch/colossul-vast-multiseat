; One-shot provisioner for the Colossul multi-seat image.
;
; Runs once at boot, ahead of any seat. It fetches/builds the Storyrendr source
; and then *generates* the seat units — so seats cannot start before the code
; and venvs they need exist. autorestart=false keeps a hard provisioning
; failure (bad token, bad ref) visible in the logs instead of thrashing.

[program:colossul-provision]
environment=PROC_NAME="%(program_name)s"
command=/opt/colossul/provision.sh
autostart=true
autorestart=false
startsecs=0
exitcodes=0
priority=50
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
